{% extends 'base.html' %}

{% block title %}{{ action }} Branch{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 600px;">
        <h2 style="margin-bottom: 1.5rem;">{{ action }} Branch</h2>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Branch Name (Required)</label>
                <input type="text" name="name" class="form-control" value="{{ branch.name|default:'' }}" required
                    placeholder="e.g., Main Branch">
            </div>

            <div class="form-group">
                <label>Address (Optional)</label>
                <textarea name="address" class="form-control" rows="3"
                    placeholder="Branch address...">{{ branch.address|default:'' }}</textarea>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn">Save Branch</button>
                <a href="{% url 'manage_branches' %}" class="btn"
                    style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted);">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
